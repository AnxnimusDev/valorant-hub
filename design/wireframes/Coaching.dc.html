<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#1A1A2E}*{box-sizing:border-box}a{color:#4CD4E8}a:hover{color:#7fe3f5}</style>
</helmet>
<div style="font-family:'Inter',sans-serif;background:#1A1A2E;color:#fff;min-height:100vh;padding-bottom:80px">
  <div style="position:sticky;top:0;z-index:10;height:64px;background:#16213E;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:space-between;padding:0 32px">
    <div style="display:flex;align-items:center;gap:36px">
      <a href="Dashboard.dc.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff">
        <div style="width:16px;height:16px;background:#E94560;transform:rotate(45deg);border-radius:2px"></div>
        <span style="font-family:'DM Sans',sans-serif;font-weight:800;font-size:17px">VALORANT<span style="color:#E94560">HUB</span></span>
      </a>
      <div style="display:flex;gap:28px">
        <a href="Dashboard.dc.html" style="font-size:14px;color:rgba(255,255,255,0.55);text-decoration:none" style-hover="color:#fff">Dashboard</a>
        <a href="Analisis-Partida.dc.html" style="font-size:14px;color:rgba(255,255,255,0.55);text-decoration:none" style-hover="color:#fff">Análisis</a>
        <a href="Recomendaciones.dc.html" style="font-size:14px;color:rgba(255,255,255,0.55);text-decoration:none" style-hover="color:#fff">Recomendaciones</a>
        <span style="font-size:14px;font-weight:600;color:#fff;border-bottom:2px solid #E94560;padding-bottom:20px">Coaching</span>
        <a href="Perfil.dc.html" style="font-size:14px;color:rgba(255,255,255,0.55);text-decoration:none" style-hover="color:#fff">Perfil</a>
      </div>
    </div>
    <a href="Perfil.dc.html" style="display:flex;align-items:center;gap:14px;text-decoration:none">
      <span style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:#4CD4E8;background:rgba(76,212,232,0.1);padding:4px 10px;border-radius:4px">DIAMANTE 3</span>
      <div style="width:34px;height:34px;border-radius:50%;background:#0F3460;border:2px solid #E94560"></div>
    </a>
  </div>

  <div style="max-width:1200px;margin:0 auto;padding:40px 32px 0">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <h1 style="font-family:'DM Sans',sans-serif;font-size:24px;font-weight:800;margin:0">Coaches</h1>
      <a href="Coaching-Chat.dc.html" style="text-decoration:none;font-size:13px;font-weight:700;background:#E94560;color:#fff;padding:9px 16px;border-radius:8px">Mis conversaciones</a>
    </div>

    <div style="display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap">
      <div style="font-size:13px;background:#16213E;border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:8px 14px">Rango: Todos</div>
      <div style="font-size:13px;background:#16213E;border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:8px 14px">Agente: Todos</div>
      <div style="font-size:13px;background:#16213E;border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:8px 14px">Idioma: Español</div>
      <div style="font-size:13px;background:#16213E;border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:8px 14px">Disponible ahora</div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:18px">
      <sc-for list="{{ coaches }}" as="c" hint-placeholder-count="6">
        <div style="background:#16213E;border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:20px">
          <div style="display:flex;gap:12px;align-items:center">
            <div style="width:46px;height:46px;border-radius:50%;background:#0F3460;border:2px solid #E94560;flex-shrink:0"></div>
            <div>
              <div style="font-family:'DM Sans',sans-serif;font-weight:700;font-size:14px">{{ c.name }}</div>
              <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#4CD4E8">{{ c.rank }} · ★ {{ c.rating }}</div>
            </div>
          </div>
          <div style="display:flex;gap:6px;margin-top:12px;flex-wrap:wrap">
            <sc-for list="{{ c.agents }}" as="ag" hint-placeholder-count="2">
              <span style="font-size:11px;background:rgba(255,255,255,0.08);padding:3px 8px;border-radius:20px">{{ ag }}</span>
            </sc-for>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px">
            <span style="font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700">{{ c.price }}</span>
            <div style="display:flex;gap:8px">
              <a href="Coaching-Chat.dc.html" style="text-decoration:none;font-size:11.5px;font-weight:700;color:#fff;border:1px solid rgba(255,255,255,0.2);padding:6px 12px;border-radius:6px">Chatear</a>
              <span style="font-size:11.5px;font-weight:700;background:#E94560;padding:6px 12px;border-radius:6px">Reservar</span>
            </div>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      coaches: [
        { name:'Alex "Reaper" M.', rank:'Radiant', rating:'4.9', agents:['Jett','Chamber'], price:'$15/sesión' },
        { name:'Sam "Vex" T.', rank:'Inmortal 3', rating:'4.7', agents:['Sova','Fade'], price:'$10/sesión' },
        { name:'Mia "Echo" K.', rank:'Radiant', rating:'5.0', agents:['Omen','Viper'], price:'$20/sesión' },
        { name:'Leo "Nomad" R.', rank:'Inmortal 2', rating:'4.6', agents:['Reyna','Raze'], price:'$8/sesión' },
        { name:'Nina "Frost" P.', rank:'Radiant', rating:'4.8', agents:['Killjoy','Cypher'], price:'$18/sesión' },
        { name:'Theo "Blaze" V.', rank:'Inmortal 1', rating:'4.5', agents:['Brimstone','Sage'], price:'$9/sesión' }
      ]
    };
  }
}
</script>
</body>
</html>

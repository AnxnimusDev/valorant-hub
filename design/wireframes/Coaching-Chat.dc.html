<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#1A1A2E}*{box-sizing:border-box}a{color:#4CD4E8}a:hover{color:#7fe3f5}</style>
</helmet>
<div style="font-family:'Inter',sans-serif;background:#1A1A2E;color:#fff;height:100vh;display:flex;flex-direction:column">
  <div style="height:64px;flex-shrink:0;background:#16213E;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:space-between;padding:0 32px">
    <div style="display:flex;align-items:center;gap:36px">
      <a href="Dashboard.dc.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff">
        <div style="width:16px;height:16px;background:#E94560;transform:rotate(45deg);border-radius:2px"></div>
        <span style="font-family:'DM Sans',sans-serif;font-weight:800;font-size:17px">VALORANT<span style="color:#E94560">HUB</span></span>
      </a>
      <div style="display:flex;gap:28px">
        <a href="Dashboard.dc.html" style="font-size:14px;color:rgba(255,255,255,0.55);text-decoration:none" style-hover="color:#fff">Dashboard</a>
        <a href="Analisis-Partida.dc.html" style="font-size:14px;color:rgba(255,255,255,0.55);text-decoration:none" style-hover="color:#fff">Análisis</a>
        <a href="Recomendaciones.dc.html" style="font-size:14px;color:rgba(255,255,255,0.55);text-decoration:none" style-hover="color:#fff">Recomendaciones</a>
        <a href="Coaching.dc.html" style="font-size:14px;font-weight:600;color:#fff;border-bottom:2px solid #E94560;padding-bottom:20px;text-decoration:none">Coaching</a>
        <a href="Perfil.dc.html" style="font-size:14px;color:rgba(255,255,255,0.55);text-decoration:none" style-hover="color:#fff">Perfil</a>
      </div>
    </div>
    <div style="width:34px;height:34px;border-radius:50%;background:#0F3460;border:2px solid #E94560"></div>
  </div>

  <div style="flex:1;display:flex;overflow:hidden">
    <div style="width:280px;flex-shrink:0;border-right:1px solid rgba(255,255,255,0.08);background:#16213E;overflow-y:auto">
      <div style="padding:16px 20px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:rgba(255,255,255,0.4)">Conversaciones</div>
      <sc-for list="{{ convos }}" as="c" hint-placeholder-count="4">
        <div onclick="{{ select($index) }}" style="display:flex;gap:12px;align-items:center;padding:12px 20px;cursor:pointer;background:{{ c.bg }};border-left:3px solid {{ c.borderColor }}">
          <div style="width:38px;height:38px;border-radius:50%;background:#0F3460;border:2px solid #E94560;flex-shrink:0"></div>
          <div style="min-width:0">
            <div style="font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ c.name }}</div>
            <div style="font-size:11.5px;color:rgba(255,255,255,0.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ c.lastMsg }}</div>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="flex:1;display:flex;flex-direction:column">
      <div style="height:64px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:12px;padding:0 24px">
        <div style="width:36px;height:36px;border-radius:50%;background:#0F3460;border:2px solid #E94560"></div>
        <div>
          <div style="font-size:14px;font-weight:700">{{ activeConvo.name }}</div>
          <div style="font-size:11.5px;color:#4CD4E8">En línea</div>
        </div>
      </div>
      <div style="flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:12px">
        <sc-for list="{{ activeConvo.messages }}" as="m" hint-placeholder-count="6">
          <div style="max-width:60%;align-self:{{ m.align }};background:{{ m.bg }};color:{{ m.color }};padding:10px 14px;border-radius:12px;font-size:13.5px;line-height:1.5">{{ m.text }}</div>
        </sc-for>
      </div>
      <div style="flex-shrink:0;padding:16px 24px;border-top:1px solid rgba(255,255,255,0.08);display:flex;gap:12px">
        <input type="text" placeholder="Escribe un mensaje…" style="flex:1;background:#16213E;border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:12px 14px;color:#fff;font-size:13.5px"/>
        <span style="background:#E94560;color:#fff;font-weight:700;font-size:13px;padding:12px 20px;border-radius:8px;cursor:pointer">Enviar</span>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { active: 0 };
  data = [
    { name:'Alex "Reaper" M.', lastMsg:'Revisá el clip que te mandé', messages:[
      { from:'coach', text:'Hola! Vi tu última partida en Ascent, buen trabajo con Jett.' },
      { from:'me', text:'Gracias! Sentí que me posicionaba mal en la retoma de B.' },
      { from:'coach', text:'Sí, exactamente. Te mando un clip marcando el timing correcto.' },
      { from:'coach', text:'Revisá el clip que te mandé' }
    ]},
    { name:'Sam "Vex" T.', lastMsg:'Nos vemos en la próxima sesión', messages:[
      { from:'me', text:'¿Podemos mover la sesión del jueves?' },
      { from:'coach', text:'Sin problema, ¿el viernes a la misma hora?' },
      { from:'me', text:'Perfecto, gracias' },
      { from:'coach', text:'Nos vemos en la próxima sesión' }
    ]},
    { name:'Mia "Echo" K.', lastMsg:'Tu economía mejoró bastante', messages:[
      { from:'coach', text:'Analicé tus últimas 5 partidas, tu economía mejoró bastante.' },
      { from:'me', text:'Qué bueno escuchar eso' }
    ]},
    { name:'Leo "Nomad" R.', lastMsg:'Dale, cualquier cosa avisame', messages:[
      { from:'me', text:'Gracias por la sesión de hoy' },
      { from:'coach', text:'Dale, cualquier cosa avisame' }
    ]}
  ];
  renderVals() {
    const convos = this.data.map((c,i)=>({ ...c, bg: i===this.state.active ? 'rgba(233,69,96,0.1)' : 'transparent', borderColor: i===this.state.active ? '#E94560' : 'transparent' }));
    const active = this.data[this.state.active];
    const activeConvo = { name: active.name, messages: active.messages.map(m => ({
      text: m.text, align: m.from==='me' ? 'flex-end' : 'flex-start',
      bg: m.from==='me' ? '#E94560' : '#16213E', color: '#fff'
    })) };
    return { convos, activeConvo, select: (i) => () => this.setState({ active: i }) };
  }
}
</script>
</body>
</html>

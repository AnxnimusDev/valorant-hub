<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#1A1A2E}*{box-sizing:border-box}input::placeholder{color:rgba(255,255,255,0.35)}a{color:#4CD4E8}a:hover{color:#7fe3f5}</style>
</helmet>
<div style="font-family:'Inter',sans-serif;background:#1A1A2E;color:#fff;min-height:100vh;display:flex">
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:64px;background:radial-gradient(circle at 30% 30%,#0F3460,#1A1A2E 70%);border-right:1px solid rgba(255,255,255,0.08)">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px">
      <div style="width:22px;height:22px;background:#E94560;transform:rotate(45deg);border-radius:3px"></div>
      <span style="font-family:'DM Sans',sans-serif;font-weight:800;font-size:22px">VALORANT<span style="color:#E94560">HUB</span></span>
    </div>
    <h1 style="font-family:'DM Sans',sans-serif;font-size:32px;font-weight:800;line-height:1.25;margin:0 0 16px;max-width:380px">Analiza tu juego. Mejora tu rango.</h1>
    <p style="font-size:14.5px;color:rgba(255,255,255,0.6);line-height:1.6;max-width:340px;margin:0">Estadísticas, coaching personalizado y predicción de rango basados en tus partidas reales.</p>
  </div>
  <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:64px">
    <div style="width:100%;max-width:380px">
      <div style="display:flex;gap:4px;background:#16213E;border-radius:10px;padding:4px;margin-bottom:32px">
        <div onclick="{{ setTab('login') }}" style="flex:1;text-align:center;padding:10px;border-radius:8px;font-size:13.5px;font-weight:700;cursor:pointer;background:{{ loginTabBg }};color:{{ loginTabColor }}">Iniciar sesión</div>
        <div onclick="{{ setTab('register') }}" style="flex:1;text-align:center;padding:10px;border-radius:8px;font-size:13.5px;font-weight:700;cursor:pointer;background:{{ registerTabBg }};color:{{ registerTabColor }}">Crear cuenta</div>
      </div>

      <sc-if value="{{ isLogin }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;flex-direction:column;gap:16px">
          <div>
            <div style="font-size:12px;font-weight:600;color:rgba(255,255,255,0.55);margin-bottom:6px">Correo electrónico</div>
            <input type="email" placeholder="tucuenta@email.com" style="width:100%;background:#16213E;border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:12px 14px;color:#fff;font-size:14px"/>
          </div>
          <div>
            <div style="font-size:12px;font-weight:600;color:rgba(255,255,255,0.55);margin-bottom:6px">Contraseña</div>
            <input type="password" placeholder="••••••••" style="width:100%;background:#16213E;border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:12px 14px;color:#fff;font-size:14px"/>
          </div>
          <a href="Dashboard.dc.html" style="text-decoration:none;text-align:center;background:#E94560;color:#fff;font-weight:700;font-size:14px;padding:13px;border-radius:8px;margin-top:8px">Iniciar sesión</a>
          <div style="text-align:center;font-size:12.5px;color:rgba(255,255,255,0.4)">¿Olvidaste tu contraseña?</div>
        </div>
      </sc-if>
      <sc-if value="{{ isRegister }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;gap:14px">
          <div>
            <div style="font-size:12px;font-weight:600;color:rgba(255,255,255,0.55);margin-bottom:6px">Nombre</div>
            <input type="text" placeholder="Tu nombre" style="width:100%;background:#16213E;border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:12px 14px;color:#fff;font-size:14px"/>
          </div>
          <div>
            <div style="font-size:12px;font-weight:600;color:rgba(255,255,255,0.55);margin-bottom:6px">Riot ID</div>
            <input type="text" placeholder="TuNombre#TAG" style="width:100%;background:#16213E;border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:12px 14px;color:#fff;font-size:14px"/>
          </div>
          <div>
            <div style="font-size:12px;font-weight:600;color:rgba(255,255,255,0.55);margin-bottom:6px">Correo electrónico</div>
            <input type="email" placeholder="tucuenta@email.com" style="width:100%;background:#16213E;border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:12px 14px;color:#fff;font-size:14px"/>
          </div>
          <div>
            <div style="font-size:12px;font-weight:600;color:rgba(255,255,255,0.55);margin-bottom:6px">Contraseña</div>
            <input type="password" placeholder="••••••••" style="width:100%;background:#16213E;border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:12px 14px;color:#fff;font-size:14px"/>
          </div>
          <a href="Dashboard.dc.html" style="text-decoration:none;text-align:center;background:#E94560;color:#fff;font-weight:700;font-size:14px;padding:13px;border-radius:8px;margin-top:4px">Crear cuenta</a>
        </div>
      </sc-if>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;defaultTab&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;login&quot;,&quot;options&quot;:[&quot;login&quot;,&quot;register&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { tab: this.props.defaultTab ?? 'login' };
  renderVals() {
    const isLogin = this.state.tab === 'login';
    return {
      isLogin, isRegister: !isLogin,
      setTab: (t) => () => this.setState({ tab: t }),
      loginTabBg: isLogin ? '#E94560' : 'transparent', loginTabColor: isLogin ? '#fff' : 'rgba(255,255,255,0.55)',
      registerTabBg: !isLogin ? '#E94560' : 'transparent', registerTabColor: !isLogin ? '#fff' : 'rgba(255,255,255,0.55)'
    };
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#1A1A2E}*{box-sizing:border-box}a{color:#4CD4E8}a:hover{color:#7fe3f5}</style>
</helmet>
<div style="font-family:'Inter',sans-serif;background:#1A1A2E;color:#fff;min-height:100vh;padding-bottom:80px">
  <div style="position:sticky;top:0;z-index:10;height:64px;background:#16213E;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:space-between;padding:0 32px">
    <div style="display:flex;align-items:center;gap:36px">
      <a href="Dashboard.dc.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff">
        <div style="width:16px;height:16px;background:#E94560;transform:rotate(45deg);border-radius:2px"></div>
        <span style="font-family:'DM Sans',sans-serif;font-weight:800;font-size:17px">VALORANT<span style="color:#E94560">HUB</span></span>
      </a>
      <div style="display:flex;gap:28px">
        <a href="Dashboard.dc.html" style="font-size:14px;color:rgba(255,255,255,0.55);text-decoration:none" style-hover="color:#fff">Dashboard</a>
        <a href="Analisis-Partida.dc.html" style="font-size:14px;color:rgba(255,255,255,0.55);text-decoration:none" style-hover="color:#fff">Análisis</a>
        <a href="Recomendaciones.dc.html" style="font-size:14px;color:rgba(255,255,255,0.55);text-decoration:none" style-hover="color:#fff">Recomendaciones</a>
        <a href="Coaching.dc.html" style="font-size:14px;color:rgba(255,255,255,0.55);text-decoration:none" style-hover="color:#fff">Coaching</a>
        <a href="Perfil.dc.html" style="font-size:14px;color:rgba(255,255,255,0.55);text-decoration:none" style-hover="color:#fff">Perfil</a>
      </div>
    </div>
    <div style="width:34px;height:34px;border-radius:50%;background:#0F3460;border:2px solid #E94560"></div>
  </div>

  <div style="max-width:900px;margin:0 auto;padding:40px 32px 0">
    <a href="Perfil.dc.html" style="font-size:12.5px;text-decoration:none;color:rgba(255,255,255,0.5)">← Volver al perfil</a>

    <div style="text-align:center;background:#16213E;border:1px solid rgba(233,69,96,0.3);border-radius:16px;padding:48px 24px;margin:20px 0 32px">
      <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:rgba(255,255,255,0.5)">Rango predicho para el próximo periodo</div>
      <div style="width:96px;height:96px;background:#0F3460;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);border:3px solid #E94560;margin:24px auto 16px"></div>
      <div style="font-family:'DM Sans',sans-serif;font-size:30px;font-weight:800">Diamante 2</div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:14px;color:#4CD4E8;margin-top:8px">confianza del modelo: 82%</div>
    </div>

    <div style="font-size:13px;font-weight:700;color:rgba(255,255,255,0.7);margin-bottom:14px">Factores considerados</div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:32px">
      <sc-for list="{{ factors }}" as="f" hint-placeholder-count="4">
        <div style="background:#16213E;border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:18px">
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:rgba(255,255,255,0.5)">{{ f.label }}</div>
          <div style="font-family:'JetBrains Mono',monospace;font-weight:700;font-size:24px;margin-top:6px">{{ f.value }}</div>
        </div>
      </sc-for>
    </div>

    <div style="background:#16213E;border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:20px">
      <div style="font-size:13px;font-weight:700;color:rgba(255,255,255,0.7);margin-bottom:16px">Precisión histórica del modelo</div>
      <div style="display:flex;align-items:flex-end;gap:10px;height:120px">
        <sc-for list="{{ accuracy }}" as="a" hint-placeholder-count="6">
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%">
            <div style="width:100%;background:#4CD4E8;border-radius:4px 4px 0 0;height:{{ a.height }}"></div>
            <div style="font-size:9px;color:rgba(255,255,255,0.35);margin-top:6px">{{ a.month }}</div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      factors: [
        { label:'KDA', value:'1.34' }, { label:'Winrate', value:'58%' },
        { label:'HS%', value:'32%' }, { label:'Tendencia', value:'↑' }
      ],
      accuracy: [
        { month:'Mar', height:'55%' }, { month:'Abr', height:'62%' }, { month:'May', height:'68%' },
        { month:'Jun', height:'71%' }, { month:'Jul', height:'78%' }, { month:'Ago', height:'82%' }
      ]
    };
  }
}
</script>
</body>
</html>

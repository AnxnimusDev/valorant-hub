name: valoranthub

networks:
  valorant-backend-net:
    driver: bridge
  valorant-ml-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  mongo_data:
  zookeeper_data:
  zookeeper_log:
  kafka_data:

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL — persistencia transaccional (match-service, recommendation-engine,
  # coaching-platform)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: valoranthub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - valorant-backend-net

  # ----------------------------------------------------------------------------
  # Redis — cache (summoner/match-ids), rate limiting del Gateway, pub/sub del
  # chat WebSocket
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: valoranthub-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - valorant-backend-net

  # ----------------------------------------------------------------------------
  # Zookeeper — coordinación de Kafka
  # ----------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: valoranthub-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_PORT}
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      # cp-zookeeper >= 7.x solo habilita "srvr" por defecto (ruok/stat están
      # deshabilitados y su whitelist no es configurable vía env var en esta
      # imagen), así que usamos srvr y comprobamos que reporta el modo.
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost ${ZOOKEEPER_PORT} | grep -q Mode"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - valorant-backend-net
      - valorant-ml-net

  # ----------------------------------------------------------------------------
  # Kafka — pipeline event-driven: match.imported, match.analysis.completed,
  # badge.unlocked
  # ----------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: valoranthub-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: ${ZOOKEEPER_HOST}:${ZOOKEEPER_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s
    networks:
      - valorant-backend-net
      - valorant-ml-net

  # ----------------------------------------------------------------------------
  # MongoDB — resultados de análisis (heatmaps, economía, timing) de
  # ai-analysis-service
  # ----------------------------------------------------------------------------
  mongo:
    image: mongo:7
    container_name: valoranthub-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: valoranthub
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - valorant-ml-net

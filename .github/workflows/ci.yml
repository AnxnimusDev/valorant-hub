name: CI

"on":
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  # match-service es el único servicio con datasource propio por ahora (JPA +
  # Flyway desde Fase 2) — va en un job aparte con un Postgres real de
  # servicio, en vez de en la matriz de abajo, que no lo provee.
  match-service:
    name: build (match-service)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: valoranthub
          POSTGRES_USER: valoranthub
          POSTGRES_PASSWORD: valoranthub_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U valoranthub -d valoranthub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: valoranthub
      POSTGRES_USER: valoranthub
      POSTGRES_PASSWORD: valoranthub_ci
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: match-service/pom.xml

      - name: Build & test
        working-directory: match-service
        run: ./mvnw -B clean verify

  backend:
    name: build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - ai-analysis-service
          - recommendation-engine
          - coaching-platform
          - prediction-service
          - api-gateway
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Build & test
        working-directory: ${{ matrix.service }}
        run: ./mvnw -B clean verify

  frontend:
    name: build (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

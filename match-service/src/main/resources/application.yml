spring:
  application:
    name: match-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:valoranthub}
    username: ${POSTGRES_USER:valoranthub}
    password: ${POSTGRES_PASSWORD:changeme_postgres}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo gestiona Flyway; Hibernate solo valida que las
      # entidades coincidan con lo migrado.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

riot-api:
  key: ${RIOT_API_KEY:}
  regional-routing: ${RIOT_REGIONAL_ROUTING:americas}
  platform-routing: ${RIOT_PLATFORM_ROUTING:na}

resilience4j:
  ratelimiter:
    instances:
      riotApi:
        # Límite por defecto de una dev key de Riot: 20 req/s.
        limit-for-period: 20
        limit-refresh-period: 1s
        timeout-duration: 5s
  circuitbreaker:
    instances:
      riotApi:
        sliding-window-type: count_based
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
